# Fetches feeds, scores and summarizes new items with Claude (Haiku, through the Claude Code CLI on the
# subscription), and commits site/data.json. Cloudflare Workers Builds deploys the site on every push to main.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`; about a year's life), and CF_API_TOKEN, CF_ACCOUNT_ID and
# CF_KV_NAMESPACE_ID for the reader's articles.
name: Build

# Every hour. The Worker's cron (wrangler.jsonc) dispatches this on time; GitHub's own schedule, often late, is the
# fallback, and skips a slot the Worker already started (the gate job), so the site builds once an hour, not twice.
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "One-off backfill: look back this many days (normal runs use 3)"
        required: false
        default: ""
  pull_request:

permissions:
  contents: write
  issues: write

# Concurrency is set on the build and smoke jobs, not here: a group on the whole workflow would put the gate job in
# the build queue too, where a scheduled run that is about to skip takes the waiting place of the dispatched build
# it defers to, cancelling it.

jobs:
  # Scheduled runs only: skip when the Worker's dispatch already started this hour's build, or has one waiting. A
  # dispatched run that was cancelled built nothing, so it doesn't count. A fork without the Worker's token never
  # dispatches, so its schedule always builds.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-50 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --event workflow_dispatch --created ">=$since" --json conclusion --jq '[.[] | select(.conclusion != "cancelled")] | length')
          echo "dispatched builds since $since, not cancelled: $n"
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Not on PRs: this job's token can write to the repo and its issues, and a PR's install and test steps run the PR's
  # code (Renovate's dependency updates included). A PR's tests run in the read-only smoke job; skipped here, this
  # required check reports success.
  build:
    needs: gate
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gate.outputs.skip != 'true' }}  # runs when the gate was skipped (not a scheduled run)
    # Scheduled and manual builds commit to main, so they share one queue: one runs, one waits, and neither is cancelled
    # by a newer one starting (a newer one does replace the one waiting). Only a run that will build joins it. A run
    # this job skips (a PR's, or a scheduled one the gate turned away) gets a group of its own, so it can't take the
    # waiting place whether or not GitHub puts a skipped job in its group.
    concurrency:
      group: ${{ github.event_name != 'pull_request' && needs.gate.outputs.skip != 'true' && 'build' || format('no-build-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The secrets that can push to main, score with Claude and write to Cloudflare are in the production environment,
    # which only main may use, so a branch can't get them even by editing this file.
    # deployment: false: secrets only, so no deployment is recorded for each run.
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}  # the latest, not the triggering commit: a run may have queued behind another's data commit
          # Pushes the data commit over SSH: main's ruleset requires PRs, and only this deploy key may bypass it.
          # Without the secret (a fork), checkout uses the token instead.
          ssh-key: ${{ secrets.DATA_PUSH_KEY }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --omit=dev  # extract.mjs's packages; wrangler is only for the smoke job
      - run: npm install -g @anthropic-ai/claude-code@2.1.319

      - run: python build.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}  # the three CF_ secrets let extract.mjs store articles for the reader
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}  # optional; build.py has a default
          SITE_TZ: ${{ vars.SITE_TZ }}  # optional; the zone stories are dated and labeled in, default America/New_York
          AUDIO_URL: ${{ vars.AUDIO_URL }}  # optional; Listen's audio bucket (audio.yml), so the page knows where to find it
          FRESH_DAYS: ${{ inputs.backfill_days || 3 }}
          PER_FEED: ${{ inputs.backfill_days && 100 || 10 }}

      - name: Commit data
        run: |
          git add site/data.json site/rss.xml site/essentials.xml site/exploited.xml site/og.png site/index.html site/icons state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"  # for the rebase too, which needs an identity once main has moved
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(data): update news"
          git pull -q --rebase origin main  # a PR merged mid-run would otherwise reject the push
          git push

      - name: Report feed health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f feed-health.md ] || exit 0  # the build stopped before checking
          issue=$(gh issue list --state open --search 'in:title "Feed health"' --json number --jq '.[0].number')
          if [ -s feed-health.md ]; then
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file feed-health.md; else gh issue create --title "Feed health" --body-file feed-health.md; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every feed is healthy again."
          fi

      - name: Fail if the reader's articles couldn't be stored
        run: |
          # build.py publishes anyway, so a KV outage doesn't throw the build away; this still turns the run red.
          [ -s reader-error.txt ] || exit 0
          cat reader-error.txt; exit 1

  # Pull requests only: the Python and JavaScript tests, then the site in a real browser under its real CSP, exercising
  # the feed, reader, search palette and swipe-back. /api/read is stubbed (see tests/test_smoke.py). Read-only, since
  # it runs the PR's code.
  smoke:
    if: github.event_name == 'pull_request'
    # Each PR gets its own group, so a burst of PRs (Renovate opens several at once) can't cancel one another's checks
    # or hold up the data build; a new push to a PR cancels that PR's run in progress.
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: npm ci
      - run: node --test 'tests/*.test.js'
      - run: pip install -r requirements.txt pytest pytest-xdist==3.8.0 pytest-timeout==2.4.0 playwright==1.65.2 axe-playwright-python==0.1.9  # no browser download: the tests use the runner's Chrome
      - run: pytest -q  # the smoke tests skip here, without SMOKE_URL
      - name: Start the site
        run: |
          # The site's Worker and upshot-sync (sync/), as deployed. The Worker sees the address it was asked for, not the
          # live domain, so the sync tests' Secure session cookie works on localhost.
          npx wrangler dev -c wrangler.jsonc -c sync/wrangler.jsonc --infer-origin-from-routes=false --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && exit 0; sleep 2; done
          cat wrangler.log; exit 1
      # One worker per core (four on a hosted runner), all against the one server: each test opens its own browser
      # contexts, and each sync is a reader of its own on the server, so they can't see each other's state.
      # -v names each test as it finishes, so a run cut short still shows which failed or never finished. A test still
      # going after 120 seconds (the slowest take about 11 locally, a few times that here) fails with its stack, rather
      # than hanging until the job's limit.
      - run: pytest -v -n auto --timeout 120 tests/test_smoke.py
        env:
          SMOKE_URL: http://127.0.0.1:8788
          PW_CHROMIUM: /usr/bin/google-chrome
      # A runner short of memory can end the step (or lose the job and its log) before pytest prints its failures. This runs
      # even then, and says whether memory ran out (the kernel's or systemd-oomd's kills) or the dev server died.
      - name: Show memory and the dev server on failure
        if: failure() || cancelled()
        run: |
          free -m
          sudo dmesg -T | grep -iE 'out of memory|oom|killed process' | tail -20 || true
          journalctl -u systemd-oomd --no-pager 2>/dev/null | tail -20 || true
          tail -40 wrangler.log || true
