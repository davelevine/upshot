# Fetches feeds, scores and summarizes new items with Claude (Haiku, through the Claude Code CLI on the
# subscription), and commits site/data.json. Cloudflare Workers Builds deploys the site on every push to main.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`; about a year's life), and CF_API_TOKEN, CF_ACCOUNT_ID and
# CF_KV_NAMESPACE_ID for the reader's articles.
name: Build

# Every hour. The Worker's cron (wrangler.jsonc) dispatches this on time; GitHub's own schedule, often late, is the
# fallback, and skips a slot the Worker already started (the gate job), so the site builds once an hour, not twice.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "One-off backfill: look back this many days (normal runs use 3)"
        required: false
        default: ""
  pull_request:

permissions:
  contents: write
  issues: write

# Scheduled and manual builds commit to main, so they share one queue. Each PR gets its own group, so a burst
# of PRs (Renovate opens several at once) can't cancel one another's checks or hold up the data build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scheduled runs only: skip when the Worker's dispatch already started this hour's build. A fork without the
  # Worker's token never dispatches, so its schedule always builds.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-50 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --event workflow_dispatch --created ">=$since" --json databaseId --jq length)
          echo "dispatched builds since $since: $n"
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}  # runs when the gate was skipped (not a scheduled run)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}  # the latest, not the triggering commit: a run may have queued behind another's data commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --omit=dev  # extract.mjs's packages; wrangler is only for the smoke job
      - if: github.event_name == 'pull_request'
        run: node --test 'tests/*.test.js'
      - if: github.event_name != 'pull_request'
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      - if: github.event_name != 'pull_request'
        run: python build.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}  # the three CF_ secrets let extract.mjs store articles for the reader
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}  # optional; build.py has a default
          SITE_TZ: ${{ vars.SITE_TZ }}  # optional; the zone stories are dated and labelled in, default America/New_York
          FRESH_DAYS: ${{ inputs.backfill_days || 3 }}
          PER_FEED: ${{ inputs.backfill_days && 100 || 10 }}

      - name: Commit data
        if: github.event_name != 'pull_request'
        run: |
          git add site/data.json site/rss.xml site/og.png site/index.html site/icons state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"  # for the rebase too, which needs an identity once main has moved
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(data): update news"
          git pull -q --rebase origin main  # a PR merged mid-run would otherwise reject the push
          git push

      - name: Report feed health
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f feed-health.md ] || exit 0  # the build stopped before checking
          issue=$(gh issue list --state open --search 'in:title "Feed health"' --json number --jq '.[0].number')
          if [ -s feed-health.md ]; then
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file feed-health.md; else gh issue create --title "Feed health" --body-file feed-health.md; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every feed is healthy again."
          fi

      - name: Fail if the reader's articles couldn't be stored
        if: github.event_name != 'pull_request'
        run: |
          # build.py publishes anyway, so a KV outage doesn't throw the build away; this still turns the run red.
          [ -s reader-error.txt ] || exit 0
          cat reader-error.txt; exit 1

  # Pull requests only: load the site in a real browser under its real CSP and exercise the feed, reader,
  # search palette and swipe-back. /api/read is stubbed (see tests/test_smoke.py).
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: npm ci
      - run: pip install pytest playwright==1.65.0 axe-playwright-python==0.1.8  # no browser download: the tests use the runner's Chrome
      - name: Start the site
        run: |
          npx wrangler dev --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &  # wrangler.jsonc: the Worker and site/, as deployed
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && exit 0; sleep 2; done
          cat wrangler.log; exit 1
      - run: pytest -q tests/test_smoke.py
        env:
          SMOKE_URL: http://127.0.0.1:8788
          PW_CHROMIUM: /usr/bin/google-chrome
