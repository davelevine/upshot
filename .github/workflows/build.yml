# Fetches feeds, scores and summarizes new items with Claude (Haiku, through the Claude Code CLI on the
# subscription), and commits site/data.json. Cloudflare Pages deploys site/ on every push to main.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`; about a year's life), and CF_API_TOKEN, CF_ACCOUNT_ID and
# CF_KV_NAMESPACE_ID for the reader's articles.
name: Build

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "One-off backfill: look back this many days (normal runs use 3)"
        required: false
        default: ""
  pull_request:

permissions:
  contents: write
  issues: write

# Scheduled and manual builds commit to main, so they share one queue. Each PR gets its own group, so a burst
# of PRs (Renovate opens several at once) can't cancel one another's checks or hold up the data build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}  # the latest, not the triggering commit: a run may have queued behind another's data commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: node --test 'tests/*.test.js'
      - if: github.event_name != 'pull_request'
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      - if: github.event_name != 'pull_request'
        run: python build.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}  # the three CF_ secrets let extract.mjs store articles for the reader
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}  # optional; build.py has a default
          FRESH_DAYS: ${{ inputs.backfill_days || 3 }}
          PER_FEED: ${{ inputs.backfill_days && 100 || 10 }}

      - name: Commit data
        if: github.event_name != 'pull_request'
        run: |
          git add site/data.json site/rss.xml site/og.png site/index.html state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"  # for the rebase too, which needs an identity once main has moved
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(data): update news"
          git pull -q --rebase origin main  # a PR merged mid-run would otherwise reject the push
          git push

      - name: Report dead feeds
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s dead-feeds.txt ] || exit 0
          body=$(printf 'These feeds have failed every fetch for 14+ days. Fix or remove them from `feeds.opml`:\n\n'; sed 's/^/- /' dead-feeds.txt)
          issue=$(gh issue list --state open --search 'in:title "Dead feeds"' --json number --jq '.[0].number')
          if [ -n "$issue" ]; then gh issue edit "$issue" --body "$body"; else gh issue create --title "Dead feeds" --body "$body"; fi

  # Pull requests only: load the site in a real browser under its real CSP and exercise the feed, reader,
  # search palette and swipe-back. /api/read is stubbed (see tests/test_smoke.py).
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: npm ci
      - run: pip install pytest playwright==1.64.1 axe-playwright-python==0.1.8  # no browser download: the tests use the runner's Chrome
      - name: Start the site
        run: |
          npx --yes wrangler@4.158.0 pages dev site --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && exit 0; sleep 2; done
          cat wrangler.log; exit 1
      - run: pytest -q tests/test_smoke.py
        env:
          SMOKE_URL: http://127.0.0.1:8788
          PW_CHROMIUM: /usr/bin/google-chrome
